<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFu</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/pdfu.css">
</head>
<body>
<!-- The window IS the device. data-* attributes drive every visual state (see css/pdfu.css). -->
<div id="device" class="device" data-theme="light" data-size="small" data-mode="idle" data-save="same">

  <div class="case">
    <svg class="grain" aria-hidden="true" preserveAspectRatio="none">
      <filter id="caseGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer></filter>
      <rect width="100%" height="100%" filter="url(#caseGrain)"/>
    </svg>

    <!-- borderless window: this top band moves the window -->
    <div class="drag-band pywebview-drag-region" aria-hidden="true"></div>

    <!-- window keys: minimize + close -->
    <div class="winkeys">
      <button type="button" class="winkey k2" data-action="minimize" title="Minimize" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 6 6" aria-hidden="true"><path fill="currentColor" d="M0 4h6v1h-6z"/></svg>
      </button>
      <button type="button" class="winkey k1" data-action="close" title="Close" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 6 6" aria-hidden="true"><path fill="currentColor" d="M0 0h1v1h-1zM1 1h1v1h-1zM2 2h2v2h-2zM4 4h1v1h-1zM5 5h1v1h-1zM5 0h1v1h-1zM4 1h1v1h-1zM1 4h1v1h-1zM0 5h1v1h-1z"/></svg>
      </button>
    </div>

    <!-- bezel + CRT screen -->
    <div class="bezel">
      <div class="crt">
        <div class="crt-inner">
          <div class="titlebar">
            <div class="titlebar-left">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M0 0h15v1h-15zM0 1h1v1h-1zM3 1h9v1h-9zM14 1h2v1h-2zM0 2h1v1h-1zM3 2h2v1h-2zM9 2h3v1h-3zM14 2h2v1h-2zM0 3h1v1h-1zM3 3h2v1h-2zM9 3h3v1h-3zM14 3h2v1h-2zM0 4h1v1h-1zM3 4h2v1h-2zM9 4h3v1h-3zM14 4h2v1h-2zM0 5h1v1h-1zM3 5h9v1h-9zM14 5h2v1h-2zM0 6h1v1h-1zM14 6h2v1h-2zM0 7h1v1h-1zM2 7h11v1h-11zM14 7h2v1h-2zM0 8h1v1h-1zM2 8h1v1h-1zM12 8h1v1h-1zM14 8h2v1h-2zM0 9h1v1h-1zM2 9h1v1h-1zM4 9h7v1h-7zM12 9h1v1h-1zM14 9h2v1h-2zM0 10h1v1h-1zM2 10h1v1h-1zM12 10h1v1h-1zM14 10h2v1h-2zM0 11h1v1h-1zM2 11h1v1h-1zM4 11h7v1h-7zM12 11h1v1h-1zM14 11h2v1h-2zM0 12h1v1h-1zM2 12h1v1h-1zM12 12h1v1h-1zM14 12h2v1h-2zM0 13h1v1h-1zM2 13h1v1h-1zM12 13h1v1h-1zM14 13h2v1h-2zM0 14h16v1h-16z"/></svg>
              <span class="title-app">PDFU.EXE</span>
              <button type="button" class="menu-title" data-action="menu" data-menu="file" aria-haspopup="true">FILE</button>
              <button type="button" class="menu-title" data-action="menu" data-menu="options" aria-haspopup="true">OPTIONS</button>
              <button type="button" class="menu-title" data-action="menu" data-menu="help" aria-haspopup="true">HELP</button>
            </div>
            <span id="status" class="title-status" aria-live="polite">READY</span>
          </div>

          <div id="view" class="view"></div>

          <div class="crt-footer">
            <div class="dither-rule" aria-hidden="true"></div>
            <div class="footer-row">
              <span class="footer-out">
                <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 2h5v1h-5zM1 3h6v1h-6zM1 4h14v1h-14zM1 5h14v1h-14zM1 6h2v1h-2zM15 6h1v1h-1zM1 7h2v1h-2zM4 7h12v1h-12zM1 8h2v1h-2zM4 8h11v1h-11zM1 9h1v1h-1zM3 9h12v1h-12zM1 10h1v1h-1zM3 10h11v1h-11zM1 11h1v1h-1zM3 11h11v1h-11zM1 12h14v1h-14zM1 13h14v1h-14z"/></svg>
                <span id="outMode">OUT: SAME FOLDER + _Unlocked</span>
              </span>
              <span class="footer-hint">DISK=LOAD&nbsp;&nbsp;UNLOCK=RUN&nbsp;&nbsp;OPEN=VIEW</span>
            </div>
          </div>

          <div id="menu" class="menu" role="menu" hidden></div>
          <div id="overlay" class="overlay" hidden></div>
        </div>

        <div class="crt-fx scanlines" aria-hidden="true"></div>
        <div class="crt-fx grille" aria-hidden="true"></div>
        <div class="crt-fx glare" aria-hidden="true"></div>
        <div class="crt-fx vignette" aria-hidden="true"></div>
      </div>
    </div>

    <!-- chin (also a drag area) -->
    <div class="chin pywebview-drag-region">
      <div class="chin-left">
        <span class="logo-light" aria-hidden="true"></span>
        <span class="logo-dark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand">PDFu</span>
        <span class="model">MODEL PU-1 · DOCUMENT UNLOCKER</span>
      </div>
      <span class="grille-light" aria-hidden="true"></span>
      <span class="grille-dark" aria-hidden="true"></span>
    </div>

    <!-- control deck -->
    <div class="deck">
      <span class="vent vent-l" aria-hidden="true"></span>
      <span class="vent vent-r" aria-hidden="true"></span>

      <!-- SAVE TO rocker -->
      <div class="rocker-group">
        <span class="rocker-title">SAVE TO:</span>
        <span class="rocker-opt opt-same"><span class="dot"></span>SAME FOLDER</span>
        <button type="button" id="rocker" class="rocker" data-action="toggle-save" aria-pressed="true"
                aria-label="Save next to the original file (off: ask for a folder each time)">
          <span class="rocker-lens"><span class="rocker-strip" aria-hidden="true"></span></span>
        </button>
        <span class="rocker-opt opt-ask"><span class="dot"></span>ASK EACH TIME</span>
      </div>

      <!-- 3.5" floppy drive -->
      <div id="drive" class="pk-drive" data-phase="empty" data-led="off" data-unlocked="false">
        <button type="button" class="pk-slot" data-action="pick" title="Disk slot: choose a PDF" aria-label="Disk slot: choose a PDF">
          <span class="pk-flap" aria-hidden="true"></span>
        </button>
        <div class="pk-row">
          <span class="pk-led-wrap"><span class="pk-led" aria-hidden="true"></span><b>A:</b></span>
          <span class="pk-spec">3.5" · 1.44 MB</span>
          <button type="button" class="pk-eject" data-action="eject" title="Eject disk" aria-label="Eject disk"></button>
        </div>
        <div class="pk-well" aria-hidden="true">
          <div class="pk-disk">
            <div class="pk-body">
              <svg class="pk-plastic" width="330" height="344" aria-hidden="true">
                <filter id="diskPlastic"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
                <rect width="330" height="344" filter="url(#diskPlastic)"/>
              </svg>
              <span class="pk-arrow-shade"></span><span class="pk-arrow-shade-stem"></span>
              <span class="pk-arrow"></span><span class="pk-arrow-stem"></span>
              <span class="pk-shutter-recess"></span>
              <span class="pk-shutter"><span class="pk-shutter-shade"></span><span class="pk-shutter-window"></span><span class="pk-shutter-grip"></span></span>
              <span class="pk-label-recess"></span>
              <div class="pk-label">
                <div class="pk-label-head"><span>PDFu</span><span>2HD · 1.44 MB</span></div>
                <span class="pk-stripes"></span>
                <span class="pk-rule" style="top:62px"></span><span class="pk-rule" style="top:96px"></span><span class="pk-rule" style="top:130px"></span>
                <div class="pk-name"></div>
                <span class="pk-stamp">UNLOCKED</span>
              </div>
              <span class="pk-wp"></span>
              <span class="pk-hd"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- PROCESS keys -->
      <div class="keys">
        <div class="keys-head" aria-hidden="true"><span class="bracket-l"></span><span>PROCESS</span><span class="bracket-r"></span></div>
        <div class="keys-row">
          <div class="key-unit">
            <div class="key-well"><div class="key-bezel">
              <button type="button" class="key k1" data-action="unlock" aria-label="Unlock: save an unlocked copy">
                <span class="cap" aria-hidden="true"></span>
                <span class="legend">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9 0h6v1h-6zM8 1h8v1h-8zM7 2h3v1h-3zM14 2h2v1h-2zM7 3h2v1h-2zM15 3h1v1h-1zM7 4h2v1h-2zM7 5h2v1h-2zM7 6h2v1h-2zM1 7h14v1h-14zM1 8h14v1h-14zM1 9h6v1h-6zM9 9h6v1h-6zM1 10h5v1h-5zM10 10h5v1h-5zM1 11h6v1h-6zM9 11h6v1h-6zM1 12h6v1h-6zM9 12h6v1h-6zM1 13h14v1h-14zM1 14h14v1h-14z"/></svg>
                  UNLOCK
                </span>
              </button>
            </div></div>
            <span id="unlockLed" class="panel-led" aria-hidden="true"></span>
          </div>
          <div class="key-unit">
            <div class="key-well"><div class="key-bezel">
              <button type="button" class="key k2" data-action="open" aria-label="Open the folder with the unlocked copy">
                <span class="cap" aria-hidden="true"></span>
                <span class="legend">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 2h5v1h-5zM1 3h6v1h-6zM1 4h14v1h-14zM1 5h14v1h-14zM1 6h2v1h-2zM15 6h1v1h-1zM1 7h2v1h-2zM4 7h12v1h-12zM1 8h2v1h-2zM4 8h11v1h-11zM1 9h1v1h-1zM3 9h12v1h-12zM1 10h1v1h-1zM3 10h11v1h-11zM1 11h1v1h-1zM3 11h11v1h-11zM1 12h14v1h-14zM1 13h14v1h-14z"/></svg>
                  OPEN
                </span>
              </button>
            </div></div>
            <span id="openLed" class="panel-led" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<input id="demoPick" type="file" accept=".pdf,application/pdf" multiple hidden>

<script src="js/bridge.js"></script>
<script src="js/drive.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
